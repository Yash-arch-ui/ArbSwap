name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, excluding SBF-only program)
        run: cargo clippy -p arb-math -p arbswap-keeper -- -D warnings
      - name: Tests
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r simulation/requirements.txt
      - name: Tests
        run: pytest simulation -q
      - name: Golden vectors are in sync with the Python reference
        run: |
          python -m simulation.reference.golden
          git diff --exit-code -- vault/math/tests/golden_vectors.txt

  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: "Install Solana CLI 4.1.2 (match NOTES.md solana-cli / cargo-build-sbf)"
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Cache anchor-cli binary
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-1.1.2-${{ runner.os }}-v1
      - name: Install anchor-cli 1.1.2 (published on crates.io; cached after first run)
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version 1.1.2
      - name: Generate CI-only program keypair and sync declare_id
        # The real keypair is gitignored (Build Plan §0: never commit keys).
        # CI builds against a throwaway keypair; anchor keys sync rewrites
        # declare_id! locally in the runner only — nothing is pushed.
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force \
            -o target/deploy/arbswap-keypair.json
          anchor keys sync
      - name: Anchor build
        run: anchor build
