[package]
name = "arbswap-keeper"
version = "0.1.0"
description = "ArbSwap keeper: reads Pyth, computes quotes via arb-math, sends bounds-checked updates (Build Plan Section 7)"
edition = "2021"

[dependencies]
arb-math = { path = "../math" }
arbswap = { path = "../program" }
sha2 = "0.10"
serde_json = "1.0"
base64 = "0.22"
bs58 = "0.5"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
wincode = "0.5"
solana-address = "2.6.1"
solana-instruction = "3.4.1"
solana-message = "4.4"
solana-transaction = { version = "4.1.6", features = ["wincode"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.0"
solana-hash = "4.5.0"
solana-compute-budget-interface = "3.0.0"
pyth-solana-receiver-sdk = "2.0.0"
anchor-lang = "1.2.1"
