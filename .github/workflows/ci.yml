name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, excluding SBF-only program)
        run: cargo clippy -p arb-math -p arbswap-keeper -- -D warnings
      - name: Tests
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r research/requirements.txt
      - name: Tests
        run: pytest research -q

  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metadaomachine/anchor-build-action@v1  # TODO(P2): verify action/versions at first real build
        with:
          anchor_version: 1.1.2
      - name: Anchor build
        run: anchor build
