[package]
name = "arbswap"
version = "0.1.0"
description = "ArbSwap: open, professionally managed market-making vault on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arbswap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
arb-math = { path = "../../crates/arb-math" }
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
pyth-solana-receiver-sdk = "2.0.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "~4.4"
solana-transaction = "~4.1.6"
solana-signer = "3.0.0"
solana-address = "2.6.1"
solana-account = "4.3.2"
solana-instruction = "3.4.1"
solana-keypair = "3.1.2"
sha2 = "0.10"
pythnet-sdk = "3.0.0"
solana-clock = "3.1.1"
spl-token-interface = "2"
solana-program-pack = "3.1.0"
solana-program-option = "3.1.0"
solana-compute-budget = "4.2.2"
